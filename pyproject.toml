[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "payshen"
version = "0.1.1"
description = "Python client for the Payshen payment orchestration API: payments, captures, voids, refunds, events and webhook verification."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Sodasoft LLC" }]
keywords = ["payshen", "payments", "payment orchestration", "psp", "webhooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://www.payshen.com/developers"
Documentation = "https://www.payshen.com/developers"
"API reference" = "https://www.payshen.com/api/v1/openapi.json"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/payshen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

name: Publish to PyPI

# Started by hand only, for a version tag (e.g. v0.1.0). PyPI trusts this
# workflow through OpenID Connect (a "trusted publisher"), so no API token is
# stored anywhere. The pypi environment can require an approval before the
# publish step runs.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: The tag is the version in pyproject.toml
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "v$version" = "$TAG" || { echo "tag $TAG does not match version $version"; exit 1; }
      - run: python -m pip install -e ".[dev]" build
      - run: python -m pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
